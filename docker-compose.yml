# ==============================================
# ISMD - Aggregator Compose (Backends + Shared Infra)
# ==============================================
# Pulls compose definitions from each repo. Assumes sibling-repo layout:
#
#   <parent>/
#   ├── ismd-validator-backend/   (validator BE)
#   ├── ismd-tool-backend/        (tool BE + postgres + keycloak + fuseki)
#   ├── ismd-validator-frontend/  (validator FE — only via docker-compose.frontends.yml)
#   ├── ismd-tool-frontend/     (tool FE     — only via docker-compose.frontends.yml)
#   └── ismd-infrastructure/    (this file)
#
# Quick start (FE developer running both backends + deps in containers):
#   cd ismd-infrastructure
#   docker compose --profile full-backend up
#
# Add containerized frontends (optional):
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.frontends.yml \
#                  --profile full-backend up
#
# Build all images from local source instead of pulling:
#   docker compose -f docker-compose.yml \
#                  -f ../ismd-validator-backend/docker-compose.build.yml \
#                  -f ../ismd-tool-backend/docker-compose.build.yml \
#                  --profile full-backend up --build
#
# Requires Docker Compose v2.20+ (for `include:` directive).
# ==============================================

include:
  - path: ../ismd-validator-backend/docker-compose.yml
  - path: ../ismd-tool-backend/docker-compose.yml
