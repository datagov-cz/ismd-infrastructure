# ==============================================
# ISMD - Aggregator Compose (Backends + Shared Infra)
# ==============================================
# Pulls compose definitions from each sibling repo. Daily use should go
# through the wrapper script, which composes the right `-f` chain + profile:
#
#   ./compose.sh up                     # full backend stack, all pulled
#   ./compose.sh up --build tool-be     # build tool backend locally
#   ./compose.sh up --frontends         # also run containerized frontends
#   ./compose.sh up --no-tool-be        # BE dev mode
#   .\compose.ps1 ...                   # PowerShell equivalent
#
# See README.md "Docker Compose Configuration" for the full flag reference.
#
# Sibling-repo path overrides (set in .env if your folder names differ from
# the defaults below):
#   VALIDATOR_BACKEND_PATH   (default: ../ismd-validator-backend)
#   TOOL_BACKEND_PATH        (default: ../ismd-tool-backend)
#   VALIDATOR_FRONTEND_PATH  (default: ../ismd-validator-frontend)
#   TOOL_FRONTEND_PATH       (default: ../ismd-tool-frontend)
#
# Requires Docker Compose v2.20+ (for `include:` directive).
# ==============================================

include:
  - path: ${VALIDATOR_BACKEND_PATH:-../ismd-validator-backend}/docker-compose.yml
  - path: ${TOOL_BACKEND_PATH:-../ismd-tool-backend}/docker-compose.yml
