<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Přístup odepřen — DIA</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #5f6368;
    --accent: #0b4f9c;
    --border: #e1e3e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-width: 32rem;
    width: 100%;
    padding: 2.5rem 2rem;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(11, 79, 156, 0.08);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    margin-bottom: 1.25rem;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.75rem;
    font-weight: 600;
  }
  p {
    color: var(--muted);
    margin: 0 0 0.75rem;
    font-size: 0.95rem;
  }
  .footer {
    margin-top: 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--muted);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #181b21;
      --text: #f1f3f5;
      --muted: #9aa0a6;
      --accent: #6ea8ff;
      --border: #2a2e36;
    }
  }
</style>
</head>
<body>
<main role="main">
  <span class="badge">Přístup odepřen</span>
  <h1>Přístup byl odepřen</h1>
  <p>Tento požadavek nebyl povolen bezpečnostními pravidly aplikace.</p>
  <p>Pokud máte za to, že jde o omyl, kontaktujte prosím správce systému.</p>
  <div class="footer">DIA · Digitální a informační agentura</div>
</main>
</body>
</html>
